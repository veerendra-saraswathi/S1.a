[project]
name = "s2-hils-connector"
version = "0.1.0"
description = "Writes HILS bench run reports into Samanvaya 2 as governed engineering events."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "jsonschema>=4.21"]

[project.scripts]
hils-submit = "s2_hils.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_hils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Matches the line length the repo's existing Python already uses.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
