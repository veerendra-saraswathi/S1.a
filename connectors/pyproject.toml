[project]
name = "s2-connectors"
version = "0.1.0"
description = "Writes a drone company's engineering events into Samanvaya 2."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "jsonschema>=4.21"]

[project.scripts]
hils-submit = "s2_connectors.cli:hils"
build-submit = "s2_connectors.cli:build_"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2_connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Matches the line length the repo's existing Python already uses.
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
